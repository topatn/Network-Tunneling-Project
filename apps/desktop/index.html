<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tunnel Tooling (GTT) · Host Console</title>
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <a href="#main-content" class="skip-link" id="skip-to-main">Skip to main workspace</a>
  <div class="app" data-shell="framed-sheet">
    <!-- L-Frame Left Leg: Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar" role="navigation" aria-label="Main Navigation">
      <div class="sidebar__top">
        <div class="brand">
          <svg class="brand-mark" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 16.5V9.5C3 5.634 6.134 2.5 10 2.5C13.866 2.5 17 5.634 17 9.5V16.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            <path d="M6.5 16.5V10C6.5 8.067 8.067 6.5 10 6.5C11.933 6.5 13.5 8.067 13.5 10V16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="10" cy="12.5" r="1.5" fill="currentColor"/>
          </svg>
          <div class="brand-copy">
            <span class="brand-title">Game Tunnel</span>
            <span class="brand-sub" id="sidebar-scope-sub">fra1.relay · QUIC v1</span>
          </div>
        </div>

        <div class="sidebar__section-label">Host Workspace</div>
        <nav class="nav-menu" aria-label="Primary Views">
          <button class="nav-item active" data-target="dashboard" aria-label="Tunnel Dashboard">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="2" y="2.5" width="5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
              <rect x="9" y="2.5" width="5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
              <rect x="2" y="9" width="12" height="4.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <span class="nav-label">Tunnel Dashboard</span>
            <span class="nav-meta" id="nav-badge-dashboard">LIVE</span>
          </button>

          <button class="nav-item" data-target="choose-game" aria-label="Choose Game Profile">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2.5 4.5H13.5M2.5 8H13.5M2.5 11.5H9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Choose Game</span>
            <span class="nav-meta">5</span>
          </button>

          <button class="nav-item" data-target="local-config" aria-label="Configure Local Server">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="5" cy="5" r="1.75" stroke="currentColor" stroke-width="1.4"/>
              <path d="M7 5H13.5M2.5 5H3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="10.5" cy="11" r="1.75" stroke="currentColor" stroke-width="1.4"/>
              <path d="M2.5 11H8.5M12.5 11H13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Configure Server</span>
            <span class="nav-meta" id="nav-badge-mappings">1/3</span>
          </button>

          <button class="nav-item" data-target="managed-server" aria-label="Managed Server Setup">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="2.5" y="2.5" width="11" height="4.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
              <rect x="2.5" y="9" width="11" height="4.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="5" cy="4.75" r="0.8" fill="currentColor"/>
              <circle cx="5" cy="11.25" r="0.8" fill="currentColor"/>
            </svg>
            <span class="nav-label">Managed Server</span>
            <span class="nav-meta" id="nav-badge-managed">Java</span>
          </button>

          <button class="nav-item" data-target="invitations" aria-label="Invitations and Guest Sharing">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M6.5 9.5L9.5 6.5M5 11L3.8 12.2C2.8 13.2 2.8 14.8 3.8 15.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <rect x="2.5" y="3" width="11" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <span class="nav-label">Invitations</span>
            <span class="nav-meta" id="nav-badge-invitations">2</span>
          </button>

          <button class="nav-item" data-target="troubleshooter" aria-label="Troubleshooter and Error Catalog">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="M8 5.2V8.4M8 10.8H8.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Troubleshooter</span>
            <span class="nav-meta" id="nav-badge-troubleshooter">6/6</span>
          </button>

          <button class="nav-item" data-target="onboarding" aria-label="Welcome and Onboarding">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 2L13 4.2V7.8C13 11.1 10.86 13.56 8 14.3C5.14 13.56 3 11.1 3 7.8V4.2L8 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span class="nav-label">Welcome &amp; Privacy</span>
          </button>

          <button class="nav-item" data-target="account" aria-label="Account and Session Settings">
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.4"/>
              <path d="M2.5 13.5C2.5 10.74 4.96 8.5 8 8.5C11.04 8.5 13.5 10.74 13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Account &amp; Session</span>
            <span class="nav-meta" id="nav-badge-account">Active</span>
          </button>
        </nav>

        <div class="sidebar__section-label">Active Target Policy</div>
        <div class="sidebar-policy-summary">
          <div class="sidebar-policy-row">
            <span>Loopback Guard</span>
            <code data-ui>INV-1</code>
          </div>
          <div class="sidebar-policy-row">
            <span>Blocked Sys Ports</span>
            <span>29 ports</span>
          </div>
          <div class="sidebar-policy-row">
            <span>Guest IP Masking</span>
            <code data-ui>/24</code>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-account" id="sidebar-account-block">
          <div class="sidebar-account__info">
            <span class="sidebar-account__name" id="sidebar-account-name">chris@desktop-win11</span>
            <span class="sidebar-account__quota" id="sidebar-account-quota">Monthly egress: 4.12 / 100 GB</span>
          </div>
          <button type="button" id="sidebar-btn-auth" class="gtt-btn gtt-btn-xs gtt-btn-secondary" aria-label="Sign out or sign in">
            Sign Out
          </button>
        </div>
        <div class="sidebar-theme-row">
          <label for="theme-select" class="sidebar-theme-label">Theme</label>
          <select id="theme-select" class="gtt-select-compact" aria-label="Color theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

    <!-- L-Frame Top Leg: Compact 48px Top Bar (no border between sidebar and topbar) -->
    <header class="top-bar" role="banner" aria-label="Workspace Header">
      <div class="top-bar__left">
        <button type="button" id="btn-menu-toggle" class="menu-toggle" aria-label="Toggle navigation drawer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2.5 4.5H13.5M2.5 8H13.5M2.5 11.5H13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <h1 id="view-title" class="view-title">Tunnel Dashboard</h1>
        <span class="top-bar__sep" aria-hidden="true">/</span>
        <span id="topbar-scope" class="top-bar__scope">Minecraft: Java Edition · 127.0.0.1:25565</span>
      </div>

      <div class="top-bar__right">
        <div class="top-bar__search-wrap">
          <input type="search"
                 id="global-filter-input"
                 class="top-bar__search"
                 placeholder="Filter flows, ports, or games..."
                 aria-label="Filter active flows or profiles" />
        </div>
        <span id="freshness-stamp" class="top-bar__fresh">Updated 14:22:08 UTC</span>
        <button type="button" id="btn-refresh-telemetry" class="gtt-btn gtt-btn-secondary gtt-btn-sm">
          Refresh
        </button>
      </div>
    </header>

    <!-- Inset Framed Sheet Workspace -->
    <main id="main-content" class="sheet" aria-live="polite">
      <!-- Dynamically populated by src/app.js -->
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="src/app.js"></script>
</body>
</html>
