[package]
name = "gtt-desktop"
description = "Desktop application shell, per-user installer, signed updater, and uninstaller for Game Tunnel Tooling (T-080, T-081, T-100, T-101, T-102)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
gtt-engine = { path = "../../crates/engine", version = "0.0.0" }
gtt-profiles = { path = "../../crates/profiles", version = "0.0.0" }
gtt-protocol = { path = "../../crates/protocol", version = "0.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"

[lints]
workspace = true
