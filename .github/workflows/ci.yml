#   PASS  cargo deny check advisories bans licenses
#   PASS  the dependency gate provably FAILS on a seeded known-vulnerable crate
#   PASS  python scripts/audit_traceability.py --self-test  (18/18 detected)
#   PASS  python scripts/audit_traceability.py             (0 errors)
#   PASS  python scripts/check_contrast.py                 (22/22 pairs)
#
# AND ON A HOSTED RUNNER, 2026-10-18. A Git remote was configured and this workflow ran
# green for the first time on hosted infrastructure. Six jobs passed: Format, Lint, Test
