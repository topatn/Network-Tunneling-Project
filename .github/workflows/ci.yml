name: ci

# CI skeleton created by T-001. NOT YET RUN — see the warning at the bottom.
# Gating requirements: TEST-007 (format, lint, tests, dependency scan, migration
# apply) and SEC-017 (dependency inventory and vulnerability scan).
#
# ACTION VERSIONS. Pinned to the latest major of each first-party action, confirmed
# 2026-10-17 against the GitHub API rather than from memory:
#   actions/checkout@v7, actions/setup-python@v7, actions/cache@v6
# These replace v4/v5/v4, which a runner reported as deprecated for targeting Node.js 20.
# RE-VERIFY before assuming they are current: nothing in this repository checks action
# versions, because such a check would need network access and would rot silently.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain. This is the version the lint, format, and test steps were
  # actually verified against locally (2026-10-17). Change it and re-verify
  # locally before changing it here, or CI and developer machines diverge
  # (AGENTS.md section 5.3).
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    # Windows is the target platform (context.md section 7), so tests run there.
    # Tooling-only checks above run on Linux, where they are cheaper.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ hashFiles('**/Cargo.lock') }}
      - name: Unit and integration tests
        run: cargo test --workspace --all-targets

  docs-audit:
    name: Documentation traceability audit
    # TEST-008. Added 2026-10-17 with scripts/audit_traceability.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Proves the checker itself still detects defects before trusting a pass.
      - name: Prove the audit detects planted defects
        run: python scripts/audit_traceability.py --self-test
      - name: Audit requirement/task/identifier consistency
        run: python scripts/audit_traceability.py

  contrast:
    name: Design token contrast (UX-005)
    # Added 2026-10-17 with scripts/check_contrast.py. Recomputes the DESIGN.md
    # section 3 table from the tokens in section 2, so an edited token or an
    # overstated ratio fails the build instead of rotting in the document.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify colour tokens and contrast claims
        run: python scripts/check_contrast.py

  dependency-scan:
    name: Dependency scan (SEC-017)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # Fails the job on any advisory in the configured severity band.
      - name: Check advisories, licences, and bans
        run: cargo deny check advisories bans licenses

  db-tests:
    name: Invariant tests against a real database (T-034)
    # T-034's stated verification is "Integration tests on a real database".
    #
    # These cannot run anywhere else. The authoring machine cannot open a normal
    # PostgreSQL client connection -- forked backends die with STATUS_DLL_INIT_FAILED
    # (see schema.md) -- and since the workspace gained dependencies it can no longer
    # link a test binary either: the GNU bundle has no assembler and MSVC has no Windows
    # SDK. So this job is the ONLY execution of the database-backed invariant tests, and
    # it runs on both supported PostgreSQL majors for the same reason the migrate job
    # does.
    #
    # The tests skip when DATABASE_URL is unset, which is why
    # `db_tests_must_not_silently_skip_in_ci` fails the build in that case: seven
    # invariant tests must not quietly become seven no-ops.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: gtt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Declares that THIS job is supposed to have a database. The test suite fails if it
      # is set and DATABASE_URL is not, so the tests cannot quietly become no-ops. It is
      # deliberately not `CI`: the plain `test` job runs in CI too and has no database
      # service by design, and keying on CI took that job red on its first run.
      REQUIRE_DB_TESTS: "true"
      # PGPORT/PGUSER/PGPASSWORD/PGDATABASE as well as DATABASE_URL: psql does not read
      # DATABASE_URL (that was the migrate job's first failure), and sqlx reads DATABASE_URL
      # only. Both sets are needed so the tests and the migration step use one connection.
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/gtt_test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-secret
      PGDATABASE: gtt_test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: db-tests-${{ hashFiles('**/Cargo.lock') }}

      - name: Install sqlx-cli for the migration step
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls

      - name: Apply migrations
        # The tests assume the schema exists. `sqlx migrate run` is ADR-017's tool and is
        # already proven by the migrate job; running it here means the tests exercise the
        # same schema an operator would get, rather than a hand-made approximation.
        run: sqlx migrate run

      - name: Confirm the schema the tests will run against
        # A test failure is hard to read if the schema behind it is not what was expected.
        # These counts are the measured baseline from schema.md.
        run: |
          set -euo pipefail
          NS="connamespace = 'public'::regnamespace"
          NOTSQLX="left(c.relname, 5) <> '_sqlx'"
          CAT="from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and $NOTSQLX"
          CON="from pg_constraint k join pg_class c on c.oid = k.conrelid join pg_namespace n on n.oid = k.connamespace where n.nspname = 'public' and $NOTSQLX"
          t=$(psql -v ON_ERROR_STOP=1 -tAc "select count(*) $CAT and c.relkind = 'r'")
          i=$(psql -v ON_ERROR_STOP=1 -tAc "select count(*) $CAT and c.relkind = 'i'")
          k=$(psql -v ON_ERROR_STOP=1 -tAc "select count(*) $CON")
          echo "tables=$t indexes=$i constraints=$k"
          [ "$t" = "12" ] && [ "$i" = "35" ] && [ "$k" = "57" ] || {
            echo "schema does not match the measured baseline; the tests would be testing something else"
            exit 1
          }

      - name: Invariant and isolation tests
        run: cargo test -p gtt-control-plane --test invariants_db -- --nocapture

      - name: Prove the database tests actually ran
        # A skipped test is not a passing test. This fails the job if the run reported no
        # database test at all, which is what would happen if DATABASE_URL were lost, the
        # test names changed, or the suite silently stopped matching anything.
        run: |
          set -euo pipefail
          cargo test -p gtt-control-plane --test invariants_db -- --list > listed.txt
          n=$(grep -c ': test$' listed.txt || true)
          echo "database tests discovered: $n"
          if [ "$n" -lt 8 ]; then
            echo "expected at least 8 database tests; the suite may have been emptied"
            exit 1
          fi

  migrate:
    name: Migrations apply to an empty database (T-033)
    # TEST-007, unblocked by T-033 (2026-10-18). Previously `if: false` because no
    # migration tool had been chosen and migrations/ did not exist.
    #
    # This job is also the ONLY way the normal-connection verification happens at all.
    # The authoring machine cannot fork a PostgreSQL backend (STATUS_DLL_INIT_FAILED),
    # so the schema was only ever applied through `postgres --single`. A service container
    # exercises the real client path: connection handling, statement boundaries, and
    # transaction behaviour, none of which `--single` touches.
    #
    # Run against BOTH supported major versions. schema.md records that the schema was
    # applied cleanly on 16.10 and 17.6, but through the line-oriented path; only this job
    # confirms it through a normal client.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # A disposable value for an ephemeral CI container. Not a secret: it exists only
          # for the lifetime of the job and reaches nothing but localhost.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: gtt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/gtt_test
      # psql does NOT read DATABASE_URL. It uses libpq's PG* variables, so without these
      # every psql call in this job fails to connect. Found by running it: the first CI run
      # failed with "revert left tables behind", which blames the migration rather than the
      # missing credentials, and because the step failed, both later verification steps
      # were skipped and every other psql call failed silently too. sqlx keeps using
      # DATABASE_URL; these exist only for psql.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-secret
      PGDATABASE: gtt_test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Install sqlx-cli
        # sqlx-cli has no prebuilt binary and must be compiled. It cannot be compiled on
        # the authoring machine (no Windows SDK, no assembler in the GNU bundle), which is
        # why this verification was impossible until CI existed. Version pinned rather
        # than floating, so the tool cannot change under the schema.
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls

      - name: Show the migration set
        run: ls -1 migrations/

      - name: psql can actually connect
        # The checks below are only meaningful if psql is talking to the service container.
        # Without the PG* variables it silently returns nothing, and under `bash -e` that
        # surfaces as a failed assertion about the schema. Fail here, loudly and first, so
        # a credential problem can never be mistaken for a schema problem.
        run: |
          set -euo pipefail
          if ! psql -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null 2>&1; then
            echo "psql cannot connect to the service container."
            echo "  PGHOST=$PGHOST PGPORT=$PGPORT PGUSER=$PGUSER PGDATABASE=$PGDATABASE"
            echo "  (PGPASSWORD is set but not printed; AGENTS.md 7 forbids logging secrets,"
            echo "   and this value is disposable CI-only regardless)"
            psql -v ON_ERROR_STOP=1 -tAc "select 1" || true
            exit 1
          fi
          echo "psql connected: $(psql -v ON_ERROR_STOP=1 -tAc 'select version()' | cut -d, -f1)"

      - name: Apply all migrations to an empty database
        run: |
          sqlx migrate info
          sqlx migrate run

      - name: Re-running must be a no-op
        # Idempotency is a property of the tool, not of luck. If migrate run is not
        # idempotent, a retry after a partial failure would corrupt the schema.
        run: |
          sqlx migrate run
          sqlx migrate run

      - name: Revert and re-apply
        # The .down.sql files exist for local and test teardown (schema.md rule 4: a
        # deployed system rolls back with a compensating forward migration, never a
        # revert). Left untested they rot, and a down file that cannot run is worse
        # than none. Verified locally on 2026-10-18 by applying up, then down, then up
        # again: 12 tables -> 0 -> 12, zero errors on PostgreSQL 16.10.
        run: |
          sqlx migrate revert
          # `_sqlx%` is sqlx's own bookkeeping table. It survives a revert (the ROW is
          # removed, the table is not), so a bare count would be 1, not 0. Excluding it is
          # what makes this assert about the schema rather than about the tool.
          remaining="$(psql -v ON_ERROR_STOP=1 -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relname not like '\_sqlx%'")"
          if [ "$remaining" != "0" ]; then
            echo "revert left $remaining table(s) behind; expected 0"
            exit 1
          fi
          echo "revert left 0 tables, as expected"
          sqlx migrate run

      - name: Verify the resulting structure
        run: |
          set -euo pipefail
          q() { psql -v ON_ERROR_STOP=1 -tAc "$1"; }
          fail=0
          check() {
            local label="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then
              echo "  OK   $label = $actual"
            else
              echo "  FAIL $label = $actual (expected $expected)"
              fail=1
            fi
          }

          # Counts MEASURED from the catalog on 2026-10-18 by applying this exact
          # migration, not copied from a document. Identical on PostgreSQL 16.10 and 17.6,
          # so a single assertion is safe across the matrix.
          #
          # Read from pg_constraint, NOT information_schema.table_constraints. The
          # information_schema view reported 102 CHECK constraints where pg_constraint
          # reports 23, and 611 across all schemas -- using it would have hardcoded a
          # wrong number into this gate.
          #
          # EXCLUDING sqlx's OWN TABLE. sqlx creates `_sqlx_migrations` in the target
          # schema, and it declares `version BIGINT PRIMARY KEY`, so it contributes a
          # table AND a pkey index AND a primary-key constraint. The expected values were
          # measured with `postgres --single`, which has no sqlx at all.
          #
          # This was fixed once INCOMPLETELY: `_sqlx` was excluded from the table count but
          # not from the index or constraint counts, so the first real run saw 13 tables
          # (caught) but also 36 indexes, 13 primary keys and 58 constraints (missed). The
          # constraint queries join pg_class as `c` so one exclusion covers all of them.
          # `left(relname,5) <> '_sqlx'` rather than a backslash-escaped LIKE, so there is
          # no shell escaping between here and PostgreSQL.
          NOTSQLX="left(c.relname, 5) <> '_sqlx'"
          CAT="from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and $NOTSQLX"
          CON="from pg_constraint k join pg_class c on c.oid = k.conrelid join pg_namespace n on n.oid = k.connamespace where n.nspname = 'public' and $NOTSQLX"

          check "tables"             "$(q "select count(*) $CAT and c.relkind = 'r'")" 12
          check "indexes"            "$(q "select count(*) $CAT and c.relkind = 'i'")" 35
          check "foreign keys"       "$(q "select count(*) $CON and k.contype = 'f'")" 13
          check "check constraints"  "$(q "select count(*) $CON and k.contype = 'c'")" 23
          check "unique constraints" "$(q "select count(*) $CON and k.contype = 'u'")" 9
          check "primary keys"       "$(q "select count(*) $CON and k.contype = 'p'")" 12
          check "constraints total"  "$(q "select count(*) $CON")" 57

          echo "  info audit_events has no foreign keys (INV-5): $(q "select count(*) from pg_constraint where contype = 'f' and conrelid = 'audit_events'::regclass")"
          check "PRIV-006 email columns" "$(q "select count(*) from information_schema.columns where table_schema = 'public' and column_name like '%email%'")" 0
          check "INV-1 local/target columns" "$(q "select count(*) from information_schema.columns where table_schema = 'public' and (column_name like '%local\_%' or column_name like '%target\_%')")" 0
          check "gen_random_uuid needs no extension" "$(q "select count(*) from pg_proc where proname = 'gen_random_uuid'")" 1

          # Proves the exclusion is doing what it claims, rather than hiding a real object.
          echo "  info sqlx bookkeeping table present and excluded: $(q "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and left(c.relname, 5) = '_sqlx'")"
          exit $fail

      - name: Constraints actually reject bad data
        # Counts alone do not prove a CHECK constraint is enforced. Every statement below
        # was executed against a real PostgreSQL 16 cluster before being committed, and
        # that caught two mistakes in the first draft: tunnels.expires_at is NOT NULL with
        # no default, so a "valid row" insert without it failed for the wrong reason; and a
        # second insert reused an idp_issuer an earlier step had already taken, hitting
        # users_idp_uniq instead of the constraint under test. Keys are now distinct and
        # the statements are order-independent.
        run: |
          set -uo pipefail
          fail=0
          must_reject() {
            local label="$1" sql="$2"
            if psql -v ON_ERROR_STOP=1 -tAc "$sql" >/dev/null 2>&1; then
              echo "  FAIL $label was ACCEPTED but must be rejected"
              fail=1
            else
              echo "  OK   $label rejected"
            fi
          }
          must_accept() {
            local label="$1" sql="$2"
            if psql -v ON_ERROR_STOP=1 -tAc "$sql" >/dev/null 2>&1; then
              echo "  OK   $label accepted"
            else
              echo "  FAIL $label was REJECTED but should be valid"
              fail=1
            fi
          }
          # Owner row the tunnel statements reference.
          psql -v ON_ERROR_STOP=1 -tAc "insert into users (idp_issuer,idp_subject) values ('seed','seed')"

          must_reject "users_status_chk" \
            "insert into users (idp_issuer,idp_subject,status) values ('r1','s','bogus')"
          must_reject "tunnels_profile_version_chk" \
            "insert into tunnels (owner_id,name,game_profile_id,profile_version,expires_at) select id,'n2','p',0,now()+interval '1 day' from users where idp_issuer='seed'"
          must_reject "tunnels_expiry_chk" \
            "insert into tunnels (owner_id,name,game_profile_id,profile_version,expires_at) select id,'n3','p',1,now() from users where idp_issuer='seed'"
          must_reject "tunnels_stopped_consistency_chk" \
            "insert into tunnels (owner_id,name,game_profile_id,profile_version,expires_at,state) select id,'n4','p',1,now()+interval '1 day','stopped' from users where idp_issuer='seed'"

          must_accept "users valid row" \
            "insert into users (idp_issuer,idp_subject) values ('a1','s')"
          must_accept "tunnels valid row" \
            "insert into tunnels (owner_id,name,game_profile_id,profile_version,expires_at) select id,'n1','p',1,now()+interval '1 day' from users where idp_issuer='seed'"
          exit $fail

# HISTORY -- verified locally on 2026-10-17 against rustc/clippy/rustfmt 1.99.1 and
# cargo-deny 0.20.2 (official prebuilt Windows binary, checksum verified):
