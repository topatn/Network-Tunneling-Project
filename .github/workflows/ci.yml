name: ci

# CI skeleton created by T-001. NOT YET RUN — see the warning at the bottom.
# Gating requirements: TEST-007 (format, lint, tests, dependency scan, migration
# apply) and SEC-017 (dependency inventory and vulnerability scan).
#
# ACTION VERSIONS. Pinned to the latest major of each first-party action, confirmed
# 2026-10-17 against the GitHub API rather than from memory:
#   actions/checkout@v7, actions/setup-python@v7, actions/cache@v6
# These replace v4/v5/v4, which a runner reported as deprecated for targeting Node.js 20.
# RE-VERIFY before assuming they are current: nothing in this repository checks action
# versions, because such a check would need network access and would rot silently.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain. This is the version the lint, format, and test steps were
  # actually verified against locally (2026-10-17). Change it and re-verify
  # locally before changing it here, or CI and developer machines diverge
  # (AGENTS.md section 5.3).
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    # Windows is the target platform (context.md section 7), so tests run there.
    # Tooling-only checks above run on Linux, where they are cheaper.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ hashFiles('**/Cargo.lock') }}
      - name: Unit and integration tests
        run: cargo test --workspace --all-targets

  docs-audit:
    name: Documentation traceability audit
    # TEST-008. Added 2026-10-17 with scripts/audit_traceability.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Proves the checker itself still detects defects before trusting a pass.
      - name: Prove the audit detects planted defects
        run: python scripts/audit_traceability.py --self-test
      - name: Audit requirement/task/identifier consistency
        run: python scripts/audit_traceability.py

  contrast:
    name: Design token contrast (UX-005)
    # Added 2026-10-17 with scripts/check_contrast.py. Recomputes the DESIGN.md
    # section 3 table from the tokens in section 2, so an edited token or an
    # overstated ratio fails the build instead of rotting in the document.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify colour tokens and contrast claims
        run: python scripts/check_contrast.py

  dependency-scan:
    name: Dependency scan (SEC-017)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # Fails the job on any advisory in the configured severity band.
      - name: Check advisories, licences, and bans
        run: cargo deny check advisories bans licenses

  migrate:
    name: Migrations apply to an empty database
    # TEST-007. Disabled until T-003 chooses a migration tool and T-033 creates
    # migrations/. Enabling it before then would fail for the wrong reason.
    if: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: gtt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply all migrations to an empty database
        run: echo "Not implemented. Replaced by T-033."

