# Advisories, bans, and licence policy (SEC-017).
#
# Kept minimal on purpose. Tighten once the first real dependencies exist, and
# record every suppression with a justification in docs/dependency-register.md.

[graph]
all-features = true

[advisories]
version = 2
# No ignores. Adding one requires a written justification in the register.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
# Copyleft and proprietary licences need an explicit decision before use.
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "SSPL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"