# Advisories, bans, and licence policy (SEC-017).
#
# VERIFIED against cargo-deny 0.20.2 on 2026-10-17. An earlier version used
# `[licenses] deny = [...]`, which was removed in this release and made the whole
# config file fail validation -- so the file was never actually parsed before.
# Rejection is now expressed by *omission*: anything not in `allow` fails.
#
# Verified: `cargo deny check advisories bans licenses` runs clean on the current
# workspace, and a seeded known-vulnerable dependency makes the advisory check fail.
# See docs/dependency-register.md.

[graph]
all-features = true

[advisories]
version = 2
# No ignores. Adding one requires a written justification in the register.
ignore = []

[licenses]
version = 2
# Permissive licences only. Copyleft and proprietary licences (GPL, AGPL, SSPL,
# proprietary) are deliberately absent, which denies them.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
# An allowance that matches no crate in the dependency graph. The workspace
# currently has zero dependencies, so every allowance is unmatched and this
# would otherwise fail the licences check outright (verified 2026-10-17).
# "warn" keeps the check meaningful once dependencies exist, without failing
# on an empty graph.
unused-allowed-license = "warn"

[licenses.private]
# Every workspace crate is `publish = false`, so none will ever be published.
# Their licence field is the Cargo convention "UNLICENSED", which is not a valid
# SPDX expression, and the project's own licensing decision has deliberately not
# been made yet (see docs/dependency-register.md). Ignore private crates rather
# than inventing a licence for them here.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A wildcard requirement is denied above; this makes the message explicit.
deny = [
    { name = "openssl", reason = "Prefer rustls: OpenSSL adds a native build dependency and its licence posture needs review." },
]