services:
  postgres:
    image: postgres:17-alpine
    container_name: gtt-dev-postgres
    environment:
      POSTGRES_USER: gtt
      POSTGRES_PASSWORD: gtt_dev_insecure_pass
      POSTGRES_DB: gtt_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gtt_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtt -d gtt_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gtt_dev_pgdata:
