# Staging Monitoring Stack: Prometheus and Grafana (T-103 / OPS-002 / OPS-006)
# Pre-configured with GTT alert rules, scrape targets, and operational dashboards.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gtt-staging-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - gtt_staging_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: gtt-staging-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=staging_admin_change_in_vault
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - gtt_staging_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  gtt_staging_prometheus_data:
  gtt_staging_grafana_data:
