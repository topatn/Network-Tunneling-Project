[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/profiles",
    "crates/engine",
    "crates/relay",
    "crates/control-plane",
    "crates/server-manager",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
# MSRV 1.94, raised from 1.77 on 2026-10-17 because `sqlx` declares
# rust-version 1.94.0 and ADR-008 accepted it as the PostgreSQL driver.
# Note: this is only meaningful once that dependency is actually added (T-030).
rust-version = "1.94"
license = "UNLICENSED"
publish = false

# Centralised dependency declaration. Every dependency added here MUST also be
# recorded in the dependency register (T-030) with purpose, licence, and
# maintenance notes, in the same change (AGENTS.md section 5).
[workspace.dependencies]
# Added by T-034. Each has a register row in docs/dependency-register.md, as
# AGENTS.md section 5.1 requires in the same change.

# PostgreSQL driver and migration runner (ADR-008, ADR-017).
#
# `default-features = false` on purpose: the defaults enable `sqlite`, `mysql` and
# `native-tls`. This project is PostgreSQL-only, and the CI migrate job already builds
# `sqlx-cli --no-default-features --features postgres,rustls` successfully, so this
# combination is proven rather than assumed.
#
# `macros` and `derive` are both deliberately NOT enabled. `macros` would enable
# `query!`/`query_as!`, which type-check SQL at compile time and so need either a live
# database or a checked-in `.sqlx` cache -- unavailable here (see schema.md). `derive`
# was tried and reverted: it pulls in `sqlx-macros`, a proc-macro crate, and a proc macro
# must be linked to a dylib, which this machine cannot do at all (no assembler on the GNU
# side, no Windows SDK on the MSVC side). Losing `cargo check`, `clippy` and `test`
# entirely to save boilerplate is a bad trade, so `FromRow` is implemented with a
# `macro_rules!` macro instead -- see crates/control-plane/src/db/entities.rs.
# The runtime-checked `sqlx::query` / `query_as` API is used throughout.
# Revisit when `.sqlx` offline data can be generated; not a silent omission.
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---------------------------------------------------------------------------
# Workspace lints. Crates opt in with `[lints] workspace = true`, so this is the
# single place a policy change is made. Levels are `deny` because AGENTS.md
# section 4 states that lint failures block merging.
#
# VERIFIED on rustc/clippy 1.99.1 — these names were checked against the real
# toolchain after an earlier draft put an invalid rustc lint in clippy.toml.
# ---------------------------------------------------------------------------

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Correctness and risk first.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Untrusted input is everywhere here (network data, files, user text) and
# AGENTS.md section 4 forbids panics, so the panic-prone lints are denied.
panic = { level = "deny", priority = -1 }
unwrap_used = { level = "deny", priority = -1 }
expect_used = { level = "deny", priority = -1 }
# Bounds checks are removed by indexing, which on untrusted input is a panic path.
indexing_slicing = { level = "deny", priority = -1 }
# Performance is a product concern for a data-plane relay (NET-002, PERF-002).
perf = { level = "deny", priority = -1 }
# Hygiene.
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }

# Deliberately NOT denied, with a reason (AGENTS.md section 5.1 analogue):
#   integer_arithmetic — a byte-level protocol implementation does bit and
#     arithmetic manipulation constantly. Denying it guarantees a stream of
#     suppressions, and a policy that is routinely silenced protects nothing.
#     Reconsider once real framing code exists (T-031).