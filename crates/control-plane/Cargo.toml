[package]
name = "gtt-control-plane"
description = "HTTP API, authorization policy, persistence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# T-034: the persistence layer. Versions are pinned centrally in the workspace
# manifest; each has a register row in docs/dependency-register.md.
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# T-042: SHA-256 request hashing for `idempotency_keys.request_hash` (`contracts.md` §8),
# wire-contract DTOs (`gtt-protocol`), and the declarative profile registry (`gtt-profiles`).
# Path dependencies declare `version = "0.0.0"` to satisfy `cargo deny` (`wildcards = "deny"`).
sha2 = "0.11"
gtt-protocol = { path = "../protocol", version = "0.0.0" }
gtt-profiles = { path = "../profiles", version = "0.0.0" }

[dev-dependencies]
# Integration tests need an async runtime and a live database. `tokio` is a
# dev-dependency only: nothing in this crate starts a runtime itself yet, and adding
# it to `[dependencies]` before the HTTP layer exists would be a dependency the code
# does not use (the dead-code lint would reject it).
tokio = { workspace = true }

[lints]
workspace = true
